<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Won 7 Crore!</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at center, #2c003e, #000);
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
  }

  h1 {
    font-size: 3rem;
    margin-top: 100px;
    text-shadow: 0 0 20px gold;
    animation: glow 1.5s infinite alternate;
  }

  @keyframes glow {
    from { text-shadow: 0 0 10px gold; }
    to { text-shadow: 0 0 30px yellow; }
  }

  #play-again {
    padding: 15px 40px;
    margin-top: 50px;
    font-size: 1.5rem;
    background: gold;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    color: #000;
    transition: background 0.3s;
  }

  #play-again:hover {
    background: yellow;
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>🎉 Congratulations! 🎉<br>You Won ₹7 Crore!</h1>
<button id="play-again">Play Again</button>

<audio id="winning-sound" src="7_crore_meme_sound_kbc.mp3" preload="auto"></audio>
<canvas id="confetti"></canvas>

<script>
// play sound
const sound = document.getElementById('winning-sound');
sound.play().catch(() => {
  // user interaction required
  document.getElementById('play-again').addEventListener('click', () => sound.play());
});

// button action
document.getElementById('play-again').onclick = () => {
  window.location.href = 'index.html'; // change to your start page
};

// Confetti animation
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const pieces = [];
const colors = ['#ff0', '#0f0', '#0ff', '#f0f', '#fff', '#ffa500'];
const numPieces = 200;

for (let i = 0; i < numPieces; i++) {
  pieces.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height - canvas.height,
    r: Math.random() * 6 + 4,
    d: Math.random() * 10 + 5,
    color: colors[Math.floor(Math.random() * colors.length)],
    tilt: Math.random() * 10 - 10
  });
}

function drawConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pieces.forEach(p => {
    ctx.beginPath();
    ctx.fillStyle = p.color;
    ctx.moveTo(p.x + p.tilt, p.y);
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  });
  updateConfetti();
  requestAnimationFrame(drawConfetti);
}

function updateConfetti() {
  pieces.forEach(p => {
    p.y += p.d / 2;
    p.x += Math.sin(p.y / 10);
    if (p.y > canvas.height) {
      p.y = -10;
      p.x = Math.random() * canvas.width;
    }
  });
}

drawConfetti();
</script>

</body>
</html>
